name: Release


on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish to (e.g. v0.1.2)'
        required: true
        default: 'v0.1.2'
      ref:
        description: 'Git ref to build from (branch/tag/commit)'
        required: true
        default: 'main'


permissions:
  contents: write


env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  BUILD_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}


jobs:
  create-release:
    # Both platform jobs upload into this release. Creating it first avoids a
    # race where two tauri-action steps try to open the same tag.
    runs-on: ubuntu-latest
    steps:
      - name: Ensure GitHub Release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists"
            exit 0
          fi
          extra=()
          case "$RELEASE_TAG" in
            *beta*|*alpha*|*rc*) extra+=(--prerelease) ;;
          esac
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "ABU Agent Desktop $RELEASE_TAG" \
            --notes "Automated macOS (Apple Silicon + Intel) + Windows (x64 NSIS/MSI installers and portable zip) build for ${RELEASE_TAG}. Built from: ${BUILD_REF}." \
            --verify-tag \
            "${extra[@]}"


  tauri-release:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-latest is Apple Silicon; macos-15-intel provides an Intel build.
          - platform: macos-latest
            name: macOS Apple Silicon
            runner_arch: arm64
            args: --bundles dmg
          - platform: macos-15-intel
            name: macOS Intel
            runner_arch: x86_64
            args: --bundles dmg
          - platform: windows-latest
            name: Windows
